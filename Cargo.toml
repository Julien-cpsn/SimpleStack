[package]
name = "simple-stack"
version = "0.1.0"
edition = "2024"

[dependencies]
gns3fy-rs = { version = "0.2.0", path = "../gns3fy-rs"}

axum = { version = "0.8.9", features = ["tracing", "macros", "form", "multipart"] }
axum-anyhow = "0.11.11"
tower-http = { version = "0.7.1", default-features = false, features = ["cors", "timeout"] }
tokio = { version = "1.16.1", features = ["rt", "rt-multi-thread", "signal"] }

anyhow = "1.0.104"
once_cell = "1.21.4"
dotenv = "0.15.0"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
directories = "6.0.0"
strum = { version = "0.28.0", features = ["strum_macros", "derive"] }

tracing = "0.1.36"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }