[package]
name = "simple-stack"
version = "0.1.0"
edition = "2024"

[dependencies]
gns3fy-rs = { version = "0.2.0", path = "../gns3fy-rs"}

axum = { version = "0.8.9", features = ["tracing", "macros", "form", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-anyhow = "0.11.11"
tower-http = { version = "0.7.1", default-features = false, features = ["cors", "timeout"] }
tokio = { version = "1.16.1", features = ["rt", "rt-multi-thread", "signal"] }

sqlx = { version = "0.9.0", features = ["sqlite", "uuid", "runtime-tokio"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid"] }

anyhow = "1.0.104"
once_cell = "1.21.4"
dotenv = "0.15.0"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
directories = "6.0.0"
strum = { version = "0.28.0", features = ["strum_macros", "derive"] }
argon2 = { version = "0.6.0", features = ["rand_core"] }
password-hash = "0.6.1"
time = "0.3.55"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tracing = "0.1.36"
tracing-subscriber = "0.3.23"
